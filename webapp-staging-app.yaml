apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webapp-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/armanruet/gitops-demo-app.git'
    targetRevision: main
    path: overlays/staging      # 👈 Staging overlay
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: staging          # 👈 Kubernetes "staging" namespace
  syncPolicy:
    # For staging we might want manual control:
    automated:                  # If you prefer manual approval, remove this block
      prune: true
      selfHeal: true
